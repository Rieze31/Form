<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="left-side">

        <div class="logo-name">
            <img src="odin-lined.png" alt="Odin-Logo">
            <h1>Odin</h1>
        </div>
        <p class="credits">© 2023 Odin. All rights reserved.</p>
    </div>
    <div class="right-side">
        <div class="description">
            <p>This is not a real online service! You know you need
                something like this in your life to help you realize your deepest dreams Sign up now and start your journey to a better you!
            </p>
            <p>You <i>know</i> you want to.</p>
        </div>
        <form action="">
            <div class="form-co">
                <h1>Let's Get Started!</h1>
                <div class="container">  
                    <div class="first-column">
                        <label for="firstname">FIRST NAME</label>
                        <input type="text" id="firstname" name="firstname" required>
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required>
                        <label type=""password" for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="second-column">
                        <label for="lastname">LAST NAME</label>
                        <input type="text" id="lastname" name="lastname" required>
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="phone" required>             
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                </div>
            </div>
            <button type="submit">SIGN UP</button>
        </form>
        
        <p>Already have an account? <a href="#">Log in</a></p>
    </div>
</body>
</html>
